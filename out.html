<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <link rel="stylesheet" href="/ems/assets/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-ui: var(--font-ar, 'IBM Plex Sans Arabic', 'Tajawal', 'Cairo', sans-serif);
      --gold: #f3be00;
      --gold-dark: #9f8500;
      --line: #c8c8c8;
      --txt-1: #121212;
      --txt-2: #4d4d4d;
      --input-bg: #ececec;
      --error: #c81f24;
    }

    html, body {
      height: 100%;
      font-family: var(--font-ui);
      overflow: hidden;
      background: #e2e2e2;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      direction: ltr;
      padding: 34px 54px;
      position: relative;
      isolation: isolate;
      background: url('/ems/assets/images/loginImage.jpeg') center center / cover no-repeat;
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(18, 18, 18, 0.26) 0%, rgba(18, 18, 18, 0.13) 45%, rgba(18, 18, 18, 0.08) 100%);
    }

    .logo{
      width: 160px;
      max-width: 350px;
      direction: rtl;
      padding: 16px 10px 10px;
      animation: cardIn .45s ease-out;
      position: fixed;
      top: 10px;
      left : 10px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      direction: rtl;
      border-radius: 14px;
      background: #fff;
      border: 1px solid rgba(200, 200, 200, 0.96);
      box-shadow: 0 16px 42px rgba(18, 18, 18, 0.24);
      padding: 16px 10px 10px;
      animation: cardIn .45s ease-out;
    }

    .logo-wrap {
      text-align: center;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .logo-wrap img {
      width: 180px;
      max-width: 78%;
      height: auto;
      display: inline-block;
    }

    .title {
      margin-top: 6px;
      text-align: center;
      color: #121212;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 5px;
      margin-bottom: 15px;
      text-align: center;
      color: var(--txt-2);
      font-size: 16px;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      margin: 5px -10px 12px;
      background: var(--line);
    }

    .err-box {
      margin-bottom: 9px;
      border: 1px solid #f1c2c4;
      background: #fff2f3;
      color: var(--error);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .err-box i { flex-shrink: 0; }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      text-align: right;
      color: #333;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 5px;
      padding-right: 2px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      background: var(--input-bg);
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #bdbdbd;
      background: var(--input-bg);
      color: #121212;
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 600;
      padding: 0 44px 0 44px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .input-wrap input::placeholder {
      font-size: 19px;
      font-weight: 500;
    }

    .icon-r,
    .icon-l,
    .eye-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .icon-r {
      right: 6px;
      background: #f7f7f7;
      border: 1px solid #a9a9a9;
      color: #252525;
    }

    .icon-l {
      left: 6px;
      background: #f7f7f7;
      border: 1px solid #a9a9a9;
      color: #252525;
    }

    .eye-btn {
      left: 6px;
      border: 1px solid #a9a9a9;
      background: #f7f7f7;
      color: #252525;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      height: 43px;
      border: 0;
      border-radius: 10px;
      background:  #f3be00;
      color: #121212;
      font-family: var(--font-ui);
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(159, 133, 0, 0.35);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(159, 133, 0, 0.42);
    }

    .btn-primary:disabled {
      opacity: .76;
      cursor: not-allowed;
      transform: none;
    }

    .limit-box {
      margin-top: 10px;
      height: 28px;
      border-radius: 9px;
      border: 1px solid #c8c8c8;
      background: #efefef;
      color: #333;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      /* justify-content: center; */
      gap: 8px;
      padding: 0 8px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .portals {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .p-link {
      height: 33px;
      border-radius: 8px;
      border: 1px solid #c8c8c8;
      background: #ececec;
      color: #222;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .16s ease;
    }

    .p-link i {
      color: #6e6e6e;
      font-size: 10px;
    }

    .p-link:hover i {
      color: #111;
    }

    .p-link:hover {
      border-color: #9f8500;
      background: #f3be00;
      color: #121212;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 920px) {
      html, body {
        overflow: auto;
      }

      .stage {
        justify-content: center;
        padding: 18px;
      }

      .stage::before {
        background: linear-gradient(180deg, rgba(8, 10, 14, 0.34) 0%, rgba(8, 10, 14, 0.23) 100%);
      }
    }

    @media (max-width: 420px) {
      .login-card { max-width: 100%; }
      .title { font-size: 30px; }
      .subtitle { font-size: 14px; }
      .input-wrap input { font-size: 21px; }
      .btn-primary { font-size: 26px; }
      .p-link { font-size: 15px; }
    }
  </style>

<div class="stage">

 <img class="logo" src="/ems/assets/images/logo 3.png" alt="Equipation logo">

    <div class="divider"></div>

      <div class="field">
        <label for="username">اسم المستخدم</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" placeholder="اسم المستخدم" value="" required autocomplete="username" aria-label="اسم المستخدم">
          <span class="icon-r"><i class="fas fa-user"></i></span>
        </div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="........" required autocomplete="current-password" value="12345678" aria-label="........">
          <button type="button" class="eye-btn" id="togglePassword" aria-label="إظهار أو إخفاء كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
          <span class="icon-r"><i class="fas fa-lock"></i></span>

        <i class="fas fa-arrow-left"></i>

      </button>

      <div class="limit-box">
        <i class="fas fa-shield-alt"></i>

      <div class="portals">
        <a href="/ems/company/register.php" class="p-link">

        <a href="/ems/company/login.php" class="p-link">

        </a>

<script>
(function () {
  const toggle = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');

  if (toggle && password) {
    toggle.addEventListener('click', function () {
      const icon = this.querySelector('i');
      if (password.type === 'password') {
        password.type = 'text';
        if (icon) {
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        }
      } else {
        password.type = 'password';
        if (icon) {
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      }
    });
  }

  if (form && submitBtn) {
    form.addEventListener('submit', function () {
      submitBtn.disabled = true;
    });
  }
})();
</script>
